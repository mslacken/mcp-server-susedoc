version: 2

builds:
  - main: ./cmd/mcp-server-susedoc
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64, ppc64le, s390x]
    flags: [-trimpath]
    ldflags:
      - -s -w -X mcp-server-susedoc/internal/mcpserver.Version={{.Version}}

archives:
  - formats: [tar.gz]
    files: [README.md]

source:
  enabled: true

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^Merge "
